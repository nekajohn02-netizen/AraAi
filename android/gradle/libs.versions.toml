[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.12.4"
jna = "5.19.0"
junit = "4.13.2"
work = "2.12.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.0.1"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
