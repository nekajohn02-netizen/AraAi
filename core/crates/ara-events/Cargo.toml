[package]
name = "ara-events"
description = "Event Watcher: 'when X happens on this device, run this mission.' Rust owns the rules and the cooldown that keeps a flapping signal (Wi-Fi dropping in and out) from spawning a storm of missions; the host (Kotlin) owns the actual OS listeners (BroadcastReceiver, NetworkCallback) and just reports when an event happened."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ara-core-api.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
