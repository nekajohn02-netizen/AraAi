[package]
name = "ara-lan-discovery"
description = "Finds smart-home/IoT devices already on the user's own local network (SSDP/UPnP) so they can be added to ara-smarthome without typing an IP by hand. Never probes, scans, or contacts anything off the local network — Ara does not and will not offer control of devices the user doesn't own or isn't already on the same LAN as."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ara-core-api.workspace = true
serde.workspace = true
serde_json.workspace = true
