[package]
name = "ara-inference"
description = "Unified local inference engine interface with a llama.cpp (GGUF) backend."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["llama"]
llama = ["dep:llama-cpp-2", "dep:self_cell"]

[dependencies]
ara-core-api.workspace = true
serde.workspace = true
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false }
self_cell = { version = "=1.3.0", optional = true }

# On Android link libc++ statically so the app ships one self-contained .so.
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false, features = ["android-static-stdcxx"] }

[dev-dependencies]
serde_json.workspace = true
